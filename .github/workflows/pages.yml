name: Publish academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website source
        uses: actions/checkout@v6

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the website builder
        run: python -m pip install -r requirements.txt

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Build all pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python tools/build.py --site-url "$SITE_URL"

      - name: Check local links and page structure
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python tools/check_links.py --base-path "$BASE_PATH"

      - name: Upload the built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
